syntax = "proto3";

package useradmin;

option go_package = "github.com/RealTimeMap/RealTimeMap-backend/pkg/pb/useradmin";

import "google/protobuf/timestamp.proto";

// Чтение пользователей для админ-панели. Ходит сюда только admin-service:
// он дробит запрос панели на мелкие вызовы и выполняет их параллельно.
service UserAdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
  rpc GetUser(GetUserRequest) returns (User) {}

  // Активные баны пачкой; пользователи без бана в ответ не попадают.
  rpc GetActiveBans(GetActiveBansRequest) returns (GetActiveBansResponse) {}

  // Живые сессии пользователя, свежие сверху.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {}
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string phone = 4;
  string avatar = 5;
  bool is_active = 6;
  bool is_superuser = 7;
  bool is_verified = 8;
  int32 level = 9;
  int32 current_exp = 10;
  int32 total_exp = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // Провайдеры OAuth, через которые привязан аккаунт (google, yandex...).
  repeated string oauth_providers = 14;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  // Подстрока username, email или телефона.
  string search = 3;
  optional bool is_active = 4;
  optional bool is_superuser = 5;
}

message ListUsersResponse {
  repeated User items = 1;
  int64 total = 2;
}

message GetUserRequest {
  int64 id = 1;
}

message Ban {
  int64 id = 1;
  int64 user_id = 2;
  string reason = 3;
  string reason_text = 4;
  google.protobuf.Timestamp banned_at = 5;
  // Не задан у бессрочного бана.
  google.protobuf.Timestamp banned_until = 6;
  bool is_permanent = 7;
  // Не задан, если модератор удалил аккаунт.
  optional int64 moderator_id = 8;
}

message GetActiveBansRequest {
  repeated int64 user_ids = 1;
}

message GetActiveBansResponse {
  repeated Ban bans = 1;
}

message ListSessionsRequest {
  int64 user_id = 1;
}

message Session {
  string session_id = 1;
  string device_name = 2;
  string user_agent = 3;
  string ip_address = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

services:
  backend:
    build: .
    container_name: realtime-map-backend
    ports:
      - "8009:8009"
    volumes:
      - uploads_volume:/app/realtimemap/uploads
    command: ../.venv/bin/python run_main.py
    environment:
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      # Приём profile.updated из social-service: там редактируется username,
      # который этот сервис отдаёт gateway в заголовке X-User-Name.
      APP_CONFIG__KAFKA__CONSUMER_ENABLED: "true"
    networks:
      - app-network
      - web
      - kafka-network
      - service-network

  migrations:
    build: .
    container_name: db-migrations
    command: ../.venv/bin/alembic upgrade head
    networks:
      - app-network
    restart: "no"

  grpc-service:
    build: .
    container_name: grpc-container
    command: ../.venv/bin/python ./run_grpc.py
    restart: unless-stopped
    environment:
      # RegisterPermissions шлёт rbac.policy_changed
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "50052:50052"
    networks:
      - app-network
      # admin-service ходит сюда по gRPC как grpc-container:50052
      - service-network
      - kafka-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  web:
    external: true
  kafka-network:
    external: true
  service-network:
    external: true

volumes:
  uploads_volume:
